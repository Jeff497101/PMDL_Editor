name: Compilar APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Descomprimir el proyecto
        run: unzip -oq "$(ls *.zip | head -n 1)" -d proyecto
      - name: Compilar
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          cd proyecto
          "$RUNNER_TEMP/gradle-8.7/bin/gradle" assembleDebug -Prun=$GITHUB_RUN_NUMBER --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../PMDL-Editor.apk
      - name: Publicar el APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "apk-$GITHUB_RUN_NUMBER" PMDL-Editor.apk --title "PMDL Editor $GITHUB_RUN_NUMBER" --notes "APK listo para instalar."
